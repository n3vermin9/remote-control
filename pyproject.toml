[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "remote-control-voice"
version = "0.4.0"
description = "Always-listening offline voice and tray control for Windows"
readme = "README.md"
requires-python = ">=3.9,<3.13"
dependencies = [
  "vosk>=0.3.44,<0.4",
  "sounddevice>=0.4.6,<0.6",
  "pycaw==20240210; sys_platform == 'win32'",
  "pystray>=0.19.5,<0.20",
  "pillow>=10,<13",
]

[project.scripts]
remote-control = "remote_control.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
